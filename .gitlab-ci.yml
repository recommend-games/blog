default:
  image:
    name: ghcr.io/gohugoio/hugo:v0.170.1
    entrypoint: [""]
  before_script:
    - wget -qO- "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
    - . $HOME/.local/bin/env
    - hugo version
    - uv --version

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  UV_VERSION: "0.13.9"
  UV_PYTHON: "3.13"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

.build:
  script:
    - uv run --locked sync_assets.py
    - hugo --minify --panicOnWarning

test:
  extends: .build
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

deploy:
  extends: .build
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 48 hours
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
