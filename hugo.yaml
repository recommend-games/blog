baseurl: https://analysisparalysis.games/

archetypeDir: archetypes
assetDir: assets
contentdir: content
dataDir: data
layoutdir: layouts
publishdir: public
staticDir: static
themesDir: themes

title: Analysis Paralysis

DefaultContentLanguage: en
theme: beautifulhugo
enableRobotsTXT: true

Params:
  subtitle: Board Games ❤️ Data Science
  mainSections:
    - post
    - posts
  logo: logo.png
  favicon: favicon.ico
  dateFormat: January 2, 2006
  commit: false
  rss: true
  comments: false
  readingTime: true
  wordCount: true
  useHLJS: true
  socialShare: true
  showRelatedPosts: true
  author:
    name: Recommend.Games
    email: contact@recommend.games
    website: https://recommend.games/
    gitlab: recommend.games
    github: recommend-games
    twitter: recommend_games
    mastodon: 'tabletop.social/@markus'
    linkedin: markusschepke
    stackoverflow: users/2634131/markus-shepherd
    youtube: user/MarkusSchepke
    paypal: mschepke
    kaggle: mshepherd

markup:
  goldmark:
    renderer:
      unsafe: true


related:
  includeNewer: true
  threshold: 80
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: keywords
      weight: 80
    - name: date
      weight: 10


menu:
  main:
    - name: Recommend.Games
      url: https://recommend.games/#/
      weight: 10

    - name: About
      url: page/about/
      weight: 20

    - name: Donate
      url: page/donations/
      weight: 30

sitemap:
  changefreq: daily
