{{ $src := .Page.Resources.GetMatch (printf "%s*" (.Get "src")) }}
{{ if not $src }}{{ errorf "img: no page resource matches %q at %s" (.Get "src") .Position }}{{ end }}
<img
	src="{{ with .Get "size" }}{{ ($src.Resize .).RelPermalink }}{{ else }}{{ $src.RelPermalink }}{{ end }}"
	{{ with .Get "alt" }}alt="{{ . }}"{{ else }}alt=""{{ end }}
	{{ with .Get "style" }}style="{{ . | safeCSS }}"{{ end }} />
