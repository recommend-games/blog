[project]
name = "game-weight"
version = "0.1.0"
description = "Are games getting lighter or heavier?"
authors = [
    { name = "Markus Shepherd", email = "markus@recommend.games" },
]

requires-python = "==3.13.*"
dependencies = [
    "matplotlib",
    "numpy",
    "polars[numpy,pandas,pyarrow]",
    "scipy",
    "seaborn",
    "tqdm",
]

[dependency-groups]
dev = [
    "jupyter-black",
    "jupyterlab",
    "jupytext",
    "mypy",
    "ruff",
    "types-tqdm",
]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
